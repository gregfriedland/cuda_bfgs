[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "batched-bfgs"
version = "0.1.0"
description = "Batched strong-Wolfe BFGS in Python, PyTorch, and CUDA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flyte==2.5.20",
    "kubernetes>=32,<34",
    "ninja>=1.11,<2",
    "numpy>=2,<3",
    "pydantic>=2.10,<3",
    "torch==2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<1",
    "ty>=0.0.77,<1",
]

[project.scripts]
bfgs-benchmark = "batched_bfgs.benchmark:main"
bfgs-submit = "batched_bfgs.submit:main"
bfgs-wait = "batched_bfgs.wait:main"

[tool.hatch.build.targets.wheel]
packages = ["src/batched_bfgs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]
